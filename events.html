<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>رویدادهای ما 📅</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            height: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(145deg, #ffd6e0 0%, #fbc2eb 50%, #a18cd1 100%);
            z-index: -1;
        }

        .sticker {
            position: fixed;
            font-size: clamp(1.5rem, 4vw, 3rem);
            pointer-events: none;
            z-index: 2;
            animation: floatSticker 8s ease-in-out infinite;
            filter: drop-shadow(0 4px 12px rgba(255, 107, 157, 0.3));
            opacity: 0.3;
        }
        .sticker:nth-child(1) { top: 3%; left: 3%; animation-delay: 0s; font-size: clamp(2rem, 5vw, 3.5rem); }
        .sticker:nth-child(2) { top: 5%; right: 5%; animation-delay: 1.2s; }
        .sticker:nth-child(3) { bottom: 8%; left: 4%; animation-delay: 2.5s; }
        .sticker:nth-child(4) { bottom: 5%; right: 4%; animation-delay: 0.8s; font-size: clamp(2.2rem, 6vw, 4rem); }
        .sticker:nth-child(5) { top: 45%; left: 2%; animation-delay: 3.2s; font-size: 1.2rem; opacity: 0.2; }
        .sticker:nth-child(6) { top: 40%; right: 2%; animation-delay: 1.8s; font-size: 1.2rem; opacity: 0.2; }

        @keyframes floatSticker {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-10px) rotate(5deg) scale(1.05); }
            50% { transform: translateY(5px) rotate(-3deg) scale(0.95); }
            75% { transform: translateY(-8px) rotate(4deg) scale(1.02); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }

        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            bottom: -60px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            animation: rise linear infinite;
        }
        .bubble:nth-child(1) { width: 60px; height: 60px; left: 5%; animation-duration: 16s; }
        .bubble:nth-child(2) { width: 30px; height: 30px; left: 25%; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 80px; height: 80px; left: 45%; animation-duration: 22s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 45px; height: 45px; left: 70%; animation-duration: 14s; animation-delay: 1s; }
        .bubble:nth-child(5) { width: 70px; height: 70px; left: 88%; animation-duration: 19s; animation-delay: 3s; }
        @keyframes rise {
            0% { transform: translateY(0) scale(0.6); opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 8px 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            padding: 18px 14px;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.06);
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        .header .emoji-big {
            font-size: clamp(2.8rem, 8vw, 3.8rem);
            display: block;
            margin-bottom: 2px;
            animation: gentle-pulse 2.4s infinite;
        }

        @keyframes gentle-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .header h1 {
            color: #2d1b26;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 900;
            margin-bottom: 2px;
        }

        .header p {
            color: #4f3a44;
            font-size: clamp(0.8rem, 2vw, 0.95rem);
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 8px 4px 10px 4px;
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 200px;
            max-height: 480px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .events-list::-webkit-scrollbar {
            width: 4px;
        }
        .events-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .events-list::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            border-radius: 10px;
        }

        .event-item {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 18px;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.3s ease;
            flex-shrink: 0;
            min-height: 70px;
            position: relative;
        }

        .event-item:hover {
            background: rgba(255, 255, 255, 0.65);
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.1);
            transform: translateX(-5px);
        }

        .event-icon {
            font-size: 2rem;
            flex-shrink: 0;
            width: 48px;
            text-align: center;
        }

        .event-content {
            flex: 1;
            min-width: 0;
        }

        .event-content .event-date {
            font-size: 0.7rem;
            color: #7a5a68;
            font-weight: 600;
            display: block;
            margin-bottom: 3px;
        }

        .event-content .event-title {
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            font-weight: 700;
            color: #2d1b26;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.4;
        }

        .event-content .event-desc {
            font-size: clamp(0.8rem, 1.8vw, 0.9rem);
            color: #4f3a44;
            margin-top: 3px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.4;
        }

        .event-badge {
            font-size: 0.65rem;
            padding: 3px 14px;
            border-radius: 30px;
            font-weight: 700;
            flex-shrink: 0;
            background: rgba(255, 107, 157, 0.12);
            color: #d94a7a;
            border: 1px solid rgba(255, 107, 157, 0.15);
        }

        .event-badge.special {
            background: rgba(255, 193, 7, 0.12);
            color: #d97706;
            border: 1px solid rgba(255, 193, 7, 0.15);
        }

        .event-badge.important {
            background: rgba(192, 132, 252, 0.12);
            color: #7c3aed;
            border: 1px solid rgba(192, 132, 252, 0.15);
        }

        /* ===== دکمه‌های ناوبری ===== */
        .nav-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 14px;
            flex-shrink: 0;
            padding-top: 14px;
            border-top: 1.5px dashed rgba(255, 107, 157, 0.25);
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
            flex: 1;
            justify-content: center;
            min-width: 70px;
        }

        .nav-btn-secondary {
            background: linear-gradient(135deg, #c084fc, #a855f7);
            box-shadow: 0 4px 15px rgba(192, 132, 252, 0.2);
        }

        .nav-btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(192, 132, 252, 0.3);
        }

        .nav-btn-primary {
            background: linear-gradient(135deg, #ff6b9d, #ee5a8b);
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.2);
        }

        .nav-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.3);
        }

        .nav-btn-home {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .nav-btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.3);
        }

        .nav-btn-events {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2);
        }

        .nav-btn-events:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.3);
        }

        @media (max-width: 480px) {
            body { padding: 6px; }
            .glass-card { padding: 14px 10px; border-radius: 28px; }
            .events-list { 
                gap: 8px; 
                min-height: 150px; 
                max-height: 320px; 
                padding: 4px; 
                border-radius: 12px; 
            }
            .event-item { 
                padding: 10px 12px; 
                gap: 10px; 
                min-height: 60px; 
                border-radius: 14px; 
            }
            .event-icon { font-size: 1.5rem; width: 38px; }
            .nav-btn { padding: 6px 12px; font-size: 0.75rem; min-width: 50px; }
            .nav-buttons { gap: 4px; margin-top: 10px; padding-top: 10px; }
            .header .emoji-big { font-size: 2.5rem; }
            .header { margin-bottom: 10px; }
            .event-badge { font-size: 0.55rem; padding: 2px 10px; }
        }

        @media (max-width: 360px) {
            .glass-card { padding: 10px 8px; border-radius: 24px; }
            .events-list { min-height: 120px; max-height: 260px; }
            .event-item { padding: 8px 10px; min-height: 52px; }
            .event-icon { font-size: 1.2rem; width: 30px; }
            .nav-btn { padding: 4px 10px; font-size: 0.65rem; min-width: 40px; }
        }

        @media (min-width: 768px) {
            .events-list { max-height: 520px; min-height: 250px; }
        }
    </style>
</head>
<body>

    <div class="sticker">🌸</div>
    <div class="sticker">💖</div>
    <div class="sticker">🌺</div>
    <div class="sticker">💝</div>
    <div class="sticker">🌷</div>
    <div class="sticker">💗</div>

    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="app-container">
        <div class="glass-card">

            <div class="header">
                <span class="emoji-big">📅</span>
                <h1>رویدادهای ویژه ما ❤️</h1>
                <p>هر تاریخ، یه خاطره‌ی قشنگ...</p>
            </div>

            <div class="events-list" id="eventsList">
                <!-- رویدادها توسط جاوااسکریپت ساخته میشن -->
            </div>

            <div class="nav-buttons">
                <a href="index.html" class="nav-btn nav-btn-home">🏠 صفحه اصلی</a>
                <a href="timeline.html" class="nav-btn nav-btn-secondary">📖 خاطرات</a>
                <a href="gallery.html" class="nav-btn nav-btn-primary">🖼️ گالری</a>
           
            </div>

        </div>
    </div>

    <script>
        // ============================================
        // لیست رویدادهای ثابت
        // ============================================
        
        const eventsData = [
            {
                id: 1,
                persianDate: '۱۴۰۴/۰۷/۲۱',
                title: '🎂 تولد نگارم',
                icon: '🎂',
                desc: 'روز تولد عشق من، نگار جان ❤️',
                badge: 'ویژه',
                badgeType: 'special'
            },
            {
                id: 2,
                persianDate: '۱۴۰۴/۱۱/۱۸',
                title: '🎉 تولد کوری',
                icon: '🎉',
                desc: 'روز تولد خودم، کوروش عزیز 😊',
                badge: 'ویژه',
                badgeType: 'special'
            },
            {
                id: 3,
                persianDate: '۱۴۰۵/۰۶/۰۷',
                title: '💕 تاریخ متفاوت',
                icon: '💕',
                desc: 'یه تاریخ خاص و متفاوت برای ما ❤️',
                badge: 'مهم',
                badgeType: 'important'
            },
            {
                id: 4,
                persianDate: '۱۴۰۴/۰۶/۰۲',
                title: '🌹 ماهگرد عشقمون',
                icon: '🌹',
                desc: 'یک ماه از عاشقانه‌ترین روزهای زندگیمون ❤️',
                badge: 'عاشقانه',
                badgeType: 'important'
            },
            {
                id: 5,
                persianDate: '۱۴۰۶/۰۵/۰۲',
                title: '👑 سالگرد بهترین زوج تاریخ',
                icon: '👑',
                desc: 'سالگرد روزی که بهترین زوج تاریخ شدیم ❤️🔥',
                badge: 'طلایی',
                badgeType: 'special'
            }
        ];

        // ============================================
        // رندر کردن رویدادها
        // ============================================
        
        function renderEvents() {
            const list = document.getElementById('eventsList');

            if (eventsData.length === 0) {
                list.innerHTML = `
                    <div style="text-align:center; color:#7a5a68; padding:40px 0; font-size:0.9rem;">
                        <span style="font-size:2.5rem; display:block; margin-bottom:8px;">📭</span>
                        هنوز رویدادی ثبت نشده!
                    </div>
                `;
                return;
            }

            // مرتب‌سازی بر اساس تاریخ شمسی
            const sorted = [...eventsData].sort((a, b) => {
                const partsA = a.persianDate.split('/').map(Number);
                const partsB = b.persianDate.split('/').map(Number);
                if (partsA[0] !== partsB[0]) return partsA[0] - partsB[0];
                if (partsA[1] !== partsB[1]) return partsA[1] - partsB[1];
                return partsA[2] - partsB[2];
            });

            list.innerHTML = sorted.map(item => `
                <div class="event-item" data-id="${item.id}">
                    <div class="event-icon">${item.icon || '📌'}</div>
                    <div class="event-content">
                        <span class="event-date">📅 ${item.persianDate}</span>
                        <div class="event-title">${item.title}</div>
                        ${item.desc ? `<div class="event-desc">${item.desc}</div>` : ''}
                    </div>
                    <span class="event-badge ${item.badgeType || ''}">${item.badge || 'رویداد'}</span>
                </div>
            `).join('');
        }

        // ============================================
        // بارگذاری اولیه
        // ============================================
        
        document.addEventListener('DOMContentLoaded', function() {
            renderEvents();
        });
    </script>

</body>
</html>
