<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>رویدادهای آینده 📅</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            height: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(145deg, #ffd6e0 0%, #fbc2eb 50%, #a18cd1 100%);
            z-index: -1;
        }

        .sticker {
            position: fixed;
            font-size: clamp(1.5rem, 4vw, 3rem);
            pointer-events: none;
            z-index: 2;
            animation: floatSticker 8s ease-in-out infinite;
            filter: drop-shadow(0 4px 12px rgba(255, 107, 157, 0.3));
            opacity: 0.3;
        }
        .sticker:nth-child(1) { top: 3%; left: 3%; animation-delay: 0s; font-size: clamp(2rem, 5vw, 3.5rem); }
        .sticker:nth-child(2) { top: 5%; right: 5%; animation-delay: 1.2s; }
        .sticker:nth-child(3) { bottom: 8%; left: 4%; animation-delay: 2.5s; }
        .sticker:nth-child(4) { bottom: 5%; right: 4%; animation-delay: 0.8s; font-size: clamp(2.2rem, 6vw, 4rem); }
        .sticker:nth-child(5) { top: 45%; left: 2%; animation-delay: 3.2s; font-size: 1.2rem; opacity: 0.2; }
        .sticker:nth-child(6) { top: 40%; right: 2%; animation-delay: 1.8s; font-size: 1.2rem; opacity: 0.2; }

        @keyframes floatSticker {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-10px) rotate(5deg) scale(1.05); }
            50% { transform: translateY(5px) rotate(-3deg) scale(0.95); }
            75% { transform: translateY(-8px) rotate(4deg) scale(1.02); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }

        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            bottom: -60px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            animation: rise linear infinite;
        }
        .bubble:nth-child(1) { width: 60px; height: 60px; left: 5%; animation-duration: 16s; }
        .bubble:nth-child(2) { width: 30px; height: 30px; left: 25%; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 80px; height: 80px; left: 45%; animation-duration: 22s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 45px; height: 45px; left: 70%; animation-duration: 14s; animation-delay: 1s; }
        .bubble:nth-child(5) { width: 70px; height: 70px; left: 88%; animation-duration: 19s; animation-delay: 3s; }
        @keyframes rise {
            0% { transform: translateY(0) scale(0.6); opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 8px 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            padding: 18px 14px;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.06);
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        .header .emoji-big {
            font-size: clamp(2.8rem, 8vw, 3.8rem);
            display: block;
            margin-bottom: 2px;
            animation: gentle-pulse 2.4s infinite;
        }

        @keyframes gentle-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .header h1 {
            color: #2d1b26;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 900;
            margin-bottom: 2px;
        }

        .header p {
            color: #4f3a44;
            font-size: clamp(0.8rem, 2vw, 0.95rem);
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 6px 4px 8px 4px;
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 150px;
            max-height: 380px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .events-list::-webkit-scrollbar {
            width: 4px;
        }
        .events-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .events-list::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            border-radius: 10px;
        }

        .event-item {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            flex-shrink: 0;
            min-height: 65px;
            position: relative;
        }

        .event-item:hover {
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.08);
        }

        .event-icon {
            font-size: 1.8rem;
            flex-shrink: 0;
            width: 40px;
            text-align: center;
        }

        .event-content {
            flex: 1;
            min-width: 0;
        }

        .event-content .event-date {
            font-size: 0.65rem;
            color: #7a5a68;
            font-weight: 500;
            display: block;
            margin-bottom: 2px;
        }

        .event-content .event-title {
            font-size: clamp(0.9rem, 2.2vw, 1rem);
            font-weight: 700;
            color: #2d1b26;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.3;
        }

        .event-content .event-desc {
            font-size: clamp(0.75rem, 1.8vw, 0.85rem);
            color: #4f3a44;
            margin-top: 2px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.3;
        }

        .delete-event-btn {
            background: rgba(255, 0, 0, 0.08);
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 0.7rem;
            cursor: pointer;
            color: #e74c3c;
            transition: all 0.3s ease;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-event-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            transform: scale(1.1);
        }

        .add-form {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1.5px dashed rgba(255, 107, 157, 0.25);
            flex-shrink: 0;
        }

        .add-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .add-form .form-row .full-width {
            grid-column: 1 / -1;
        }

        .add-form input, .add-form select, .add-form textarea {
            padding: 8px 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            font-family: inherit;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            color: #2d1b26;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
        }

        .add-form input:focus, .add-form select:focus, .add-form textarea:focus {
            border-color: #ff6b9d;
            background: rgba(255, 255, 255, 0.5);
        }

        .add-form input::placeholder, .add-form textarea::placeholder {
            color: #8a7a82;
            font-size: 0.7rem;
        }

        .add-form textarea {
            resize: vertical;
            min-height: 40px;
            max-height: 80px;
        }

        .btn-add {
            padding: 8px 16px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: clamp(0.85rem, 2.2vw, 0.95rem);
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6b9d, #ee5a8b);
            color: #fff;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.2);
            grid-column: 1 / -1;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.3);
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 12px;
            flex-shrink: 0;
            padding-top: 12px;
            border-top: 1.5px dashed rgba(255, 107, 157, 0.25);
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
            flex: 1;
            justify-content: center;
            min-width: 70px;
        }

        .nav-btn-secondary {
            background: linear-gradient(135deg, #c084fc, #a855f7);
            box-shadow: 0 4px 15px rgba(192, 132, 252, 0.2);
        }

        .nav-btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(192, 132, 252, 0.3);
        }

        .nav-btn-primary {
            background: linear-gradient(135deg, #ff6b9d, #ee5a8b);
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.2);
        }

        .nav-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.3);
        }

        .nav-btn-home {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .nav-btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.3);
        }

        .empty-msg {
            text-align: center;
            color: #7a5a68;
            padding: 30px 0;
            font-size: 0.9rem;
        }

        .empty-msg span {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 8px;
        }

        /* ===== ورودی تاریخ شمسی ===== */
        .persian-date-input {
            display: flex;
            gap: 6px;
            grid-column: 1 / -1;
        }

        .persian-date-input select {
            flex: 1;
            padding: 8px 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            font-family: inherit;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            color: #2d1b26;
            outline: none;
            transition: all 0.3s ease;
        }

        .persian-date-input select:focus {
            border-color: #ff6b9d;
            background: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 480px) {
            body { padding: 6px; }
            .glass-card { padding: 14px 10px; border-radius: 28px; }
            .events-list { 
                gap: 8px; 
                min-height: 120px; 
                max-height: 280px; 
                padding: 4px; 
                border-radius: 12px; 
            }
            .event-item { 
                padding: 10px 12px; 
                gap: 8px; 
                min-height: 55px; 
                border-radius: 14px; 
            }
            .event-icon { font-size: 1.4rem; width: 32px; }
            .add-form .form-row {
                grid-template-columns: 1fr 1fr;
                gap: 5px;
            }
            .add-form input, .add-form select, .add-form textarea {
                padding: 6px 10px;
                font-size: 0.8rem;
                border-radius: 10px;
            }
            .btn-add {
                padding: 6px 14px;
                font-size: 0.8rem;
                border-radius: 10px;
            }
            .nav-btn { padding: 6px 12px; font-size: 0.75rem; min-width: 50px; }
            .nav-buttons { gap: 4px; margin-top: 10px; padding-top: 10px; }
            .header .emoji-big { font-size: 2.5rem; }
            .header { margin-bottom: 10px; }
            .delete-event-btn { width: 20px; height: 20px; font-size: 0.6rem; }
            .persian-date-input select { padding: 6px 8px; font-size: 0.75rem; }
        }

        @media (max-width: 360px) {
            .glass-card { padding: 10px 8px; border-radius: 24px; }
            .events-list { min-height: 100px; max-height: 220px; }
            .event-item { padding: 8px 10px; min-height: 48px; }
            .event-icon { font-size: 1.2rem; width: 28px; }
            .add-form .form-row {
                grid-template-columns: 1fr 1fr;
                gap: 4px;
            }
            .add-form input, .add-form select, .add-form textarea {
                padding: 4px 8px;
                font-size: 0.7rem;
                border-radius: 8px;
            }
            .btn-add {
                padding: 4px 10px;
                font-size: 0.7rem;
                border-radius: 8px;
            }
            .nav-btn { padding: 4px 10px; font-size: 0.65rem; min-width: 40px; }
            .persian-date-input select { padding: 4px 6px; font-size: 0.65rem; }
        }

        @media (min-width: 768px) {
            .events-list { max-height: 480px; min-height: 200px; }
        }
    </style>
</head>
<body>

    <script>
        // ============================================
        // تبدیل تاریخ شمسی به میلادی
        // ============================================
        
        function persianToGregorian(persianYear, persianMonth, persianDay) {
            // تاریخ مبنا: ۱ فروردین ۱۴۰۴ = ۲۱ مارس ۲۰۲۵
            const baseDate = new Date(2025, 2, 21); // ۲۱ مارس ۲۰۲۵
            const daysInPersianMonths = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 29];
            
            let totalDays = 0;
            
            // سال‌های کامل قبل از سال مورد نظر
            for (let y = 1404; y < persianYear; y++) {
                totalDays += 365;
                // کبیسه‌گیری ساده: هر ۴ سال یک بار
                if ((y - 1404) % 4 === 0) totalDays += 1;
            }
            
            // ماه‌های کامل قبل از ماه مورد نظر
            for (let m = 0; m < persianMonth - 1; m++) {
                totalDays += daysInPersianMonths[m];
            }
            
            // روزهای کامل قبل از روز مورد نظر
            totalDays += persianDay - 1;
            
            const result = new Date(baseDate);
            result.setDate(result.getDate() + totalDays);
            
            return result;
        }

        // ============================================
        // ذخیره‌سازی رویدادها با localStorage
        // ============================================
        
        const EVENTS_KEY = 'futureEvents';

        function getDefaultEvents() {
            return [
                {
                    id: 1,
                    persianDate: '۱۴۰۴/۵/۲۵',
                    title: 'قرار عاشقانه',
                    icon: '❤️',
                    desc: 'یه قرار قشنگ با هم دیگه داریم ❤️'
                },
                {
                    id: 2,
                    persianDate: '۱۴۰۴/۵/۳۰',
                    title: 'سالگرد آشنایی',
                    icon: '💕',
                    desc: 'یک ماه از آشنایی‌مون میگذره!'
                },
                {
                    id: 3,
                    persianDate: '۱۴۰۴/۶/۳',
                    title: 'تولد کوروش',
                    icon: '🎂',
                    desc: 'تولد کوروش عزیزم 🎉'
                }
            ];
        }

        function loadEvents() {
            const saved = localStorage.getItem(EVENTS_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data && data.length > 0) {
                        return data;
                    }
                } catch (e) {
                    console.log('خطا در بارگذاری رویدادها');
                }
            }
            return getDefaultEvents();
        }

        function saveEvents(data) {
            localStorage.setItem(EVENTS_KEY, JSON.stringify(data));
        }

        let eventsData = loadEvents();
        let nextId = eventsData.length > 0 ? Math.max(...eventsData.map(item => item.id)) + 1 : 1;

        // ===== مرتب‌سازی بر اساس تاریخ شمسی =====
        function sortByPersianDate(events) {
            return events.sort((a, b) => {
                const partsA = a.persianDate.split('/').map(Number);
                const partsB = b.persianDate.split('/').map(Number);
                
                if (partsA[0] !== partsB[0]) return partsA[0] - partsB[0];
                if (partsA[1] !== partsB[1]) return partsA[1] - partsB[1];
                return partsA[2] - partsB[2];
            });
        }

        // ===== رندر کردن رویدادها =====
        function renderEvents() {
            const list = document.getElementById('eventsList');
            
            const sorted = sortByPersianDate([...eventsData]);

            if (sorted.length === 0) {
                list.innerHTML = `
                    <div class="empty-msg">
                        <span>📭</span>
                        هنوز رویدادی ثبت نشده!<br>
                        اولین رویداد رو اضافه کن ❤️
                    </div>
                `;
                return;
            }

            list.innerHTML = sorted.map(item => `
                <div class="event-item" data-id="${item.id}">
                    <div class="event-icon">${item.icon || '📌'}</div>
                    <div class="event-content">
                        <span class="event-date">📅 ${item.persianDate}</span>
                        <div class="event-title">${item.title}</div>
                        ${item.desc ? `<div class="event-desc">${item.desc}</div>` : ''}
                    </div>
                    <button class="delete-event-btn" onclick="deleteEvent(${item.id})" title="حذف">✕</button>
                </div>
            `).join('');
        }

        // ===== اضافه کردن رویداد جدید =====
        function addEvent() {
            const yearSelect = document.getElementById('eventYear');
            const monthSelect = document.getElementById('eventMonth');
            const daySelect = document.getElementById('eventDay');
            const titleInput = document.getElementById('eventTitle');
            const iconInput = document.getElementById('eventIcon');
            const descInput = document.getElementById('eventDesc');

            const year = yearSelect.value;
            const month = monthSelect.value.padStart(2, '0');
            const day = daySelect.value.padStart(2, '0');
            const persianDate = `${year}/${month}/${day}`;
            const title = titleInput.value.trim();
            const icon = iconInput.value.trim() || '📌';
            const desc = descInput.value.trim();

            if (!title) {
                alert('لطفاً عنوان رویداد رو وارد کن! ❤️');
                return;
            }

            const newEvent = {
                id: nextId++,
                persianDate: persianDate,
                title: title,
                icon: icon,
                desc: desc || ''
            };

            eventsData.push(newEvent);
            saveEvents(eventsData);
            renderEvents();

            // پاک کردن فرم
            titleInput.value = '';
            iconInput.value = '🎉';
            descInput.value = '';

            // تنظیم تاریخ به امروز
            setDefaultDate();

            // اسکرول به پایین
            const list = document.getElementById('eventsList');
            setTimeout(() => { list.scrollTop = list.scrollHeight; }, 100);
        }

        // ===== حذف رویداد =====
        function deleteEvent(id) {
            if (confirm('آیا مطمئنی میخوای این رویداد رو حذف کنی؟ 😢')) {
                eventsData = eventsData.filter(item => item.id !== id);
                saveEvents(eventsData);
                renderEvents();
            }
        }

        // ===== تنظیم تاریخ امروز به عنوان پیش‌فرض =====
        function setDefaultDate() {
            const today = new Date();
            const persianDate = toPersianDate(today);
            const parts = persianDate.split('/');
            
            document.getElementById('eventYear').value = parts[0];
            document.getElementById('eventMonth').value = String(parseInt(parts[1]));
            document.getElementById('eventDay').value = String(parseInt(parts[2]));
        }

        // ===== تبدیل میلادی به شمسی =====
        function toPersianDate(gregorianDate) {
            const baseDate = new Date(2025, 2, 21); // ۱ فروردین ۱۴۰۴
            const diffDays = Math.floor((gregorianDate - baseDate) / (1000 * 60 * 60 * 24));
            
            let year = 1404;
            let remaining = diffDays;
            
            const daysInPersianMonths = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 29];
            
            // محاسبه سال
            while (remaining >= 365) {
                const isLeap = (year - 1404) % 4 === 0;
                const daysInYear = isLeap ? 366 : 365;
                if (remaining >= daysInYear) {
                    remaining -= daysInYear;
                    year++;
                } else {
                    break;
                }
            }
            
            // محاسبه ماه و روز
            let month = 0;
            for (let m = 0; m < daysInPersianMonths.length; m++) {
                if (remaining < daysInPersianMonths[m]) {
                    month = m + 1;
                    break;
                }
                remaining -= daysInPersianMonths[m];
            }
            
            const day = remaining + 1;
            
            return `${year}/${String(month).padStart(2, '0')}/${String(day).padStart(2, '0')}`;
        }

        // ===== کلید Enter برای اضافه کردن =====
        document.addEventListener('DOMContentLoaded', function() {
            renderEvents();
            setDefaultDate();

            const inputs = ['eventTitle', 'eventIcon', 'eventDesc'];
            inputs.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            addEvent();
                        }
                    });
                }
            });
        });
    </script>

</body>
