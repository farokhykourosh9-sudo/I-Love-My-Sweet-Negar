<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>نفس کوروش ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(145deg, #ffd6e0, #fbc2eb, #a18cd1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(255,255,255,0.35);
            backdrop-filter: blur(14px);
            border-radius: 44px;
            padding: 28px 22px;
            border: 2px solid rgba(255,255,255,0.6);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #2d1b26; font-size: 2rem; margin-bottom: 12px; }
        p { color: #3f2e38; font-size: 1.1rem; line-height: 1.7; }
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 60px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6b9d, #ee5a8b);
            color: #fff;
            margin-top: 16px;
            box-shadow: 0 6px 18px rgba(255,107,157,0.25);
        }
        .emoji-big { font-size: 4.6rem; display: block; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="glass-card">
        <span class="emoji-big">❤️</span>
        <h1>سلام عزیز دلم!</h1>
        <p>این سایت برای عشق من، نگار جان ساخته شده ❤️</p>
        <button class="btn" onclick="alert('عاشقتم نگار! ❤️')">دوست دارم!</button>
    </div>
</body>
</html>
