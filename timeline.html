<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>خاطرات ما ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            height: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(145deg, #ffd6e0 0%, #fbc2eb 50%, #a18cd1 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        .sticker {
            position: fixed;
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            pointer-events: none;
            z-index: 2;
            animation: floatSticker 8s ease-in-out infinite;
            filter: drop-shadow(0 4px 12px rgba(255, 107, 157, 0.3));
            opacity: 0.6;
        }
        .sticker:nth-child(1) { top: 5%; left: 5%; animation-delay: 0s; font-size: clamp(2.5rem, 7vw, 5rem); }
        .sticker:nth-child(2) { top: 8%; right: 8%; animation-delay: 1.2s; }
        .sticker:nth-child(3) { bottom: 12%; left: 6%; animation-delay: 2.5s; }
        .sticker:nth-child(4) { bottom: 8%; right: 6%; animation-delay: 0.8s; font-size: clamp(3rem, 8vw, 5.5rem); }
        .sticker:nth-child(5) { top: 45%; left: 2%; animation-delay: 3.2s; font-size: clamp(1.8rem, 5vw, 3.5rem); opacity: 0.4; }
        .sticker:nth-child(6) { top: 40%; right: 2%; animation-delay: 1.8s; font-size: clamp(1.8rem, 5vw, 3.5rem); opacity: 0.4; }

        @keyframes floatSticker {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-15px) rotate(5deg) scale(1.05); }
            50% { transform: translateY(5px) rotate(-3deg) scale(0.95); }
            75% { transform: translateY(-10px) rotate(4deg) scale(1.02); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }

        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            bottom: -60px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: rise linear infinite;
        }
        .bubble:nth-child(1) { width: 80px; height: 80px; left: 5%; animation-duration: 16s; }
        .bubble:nth-child(2) { width: 40px; height: 40px; left: 25%; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 110px; height: 110px; left: 45%; animation-duration: 22s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 60px; height: 60px; left: 70%; animation-duration: 14s; animation-delay: 1s; }
        .bubble:nth-child(5) { width: 90px; height: 90px; left: 88%; animation-duration: 19s; animation-delay: 3s; }
        @keyframes rise {
            0% { transform: translateY(0) scale(0.6); opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 44px;
            padding: 28px 22px;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-height: 96vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .header .emoji-big {
            font-size: clamp(3rem, 9vw, 4rem);
            display: block;
            margin-bottom: 4px;
            animation: gentle-pulse 2.4s infinite;
        }
        @keyframes gentle-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .header h1 {
            color: #2d1b26;
            font-size: clamp(1.3rem, 4.5vw, 2rem);
            font-weight: 900;
            margin-bottom: 2px;
        }
        .header p {
            color: #4f3a44;
            font-size: clamp(0.85rem, 2.2vw, 1rem);
        }

        .timeline-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
            padding-bottom: 4px;
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
            max-height: 100%;
        }
        .timeline-list::-webkit-scrollbar {
            width: 5px;
        }
        .timeline-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
        .timeline-list::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            border-radius: 10px;
        }
        .timeline-list::-webkit-scrollbar-thumb:hover {
            background: #ff6b9d;
        }

        .timeline-item {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 18px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            flex-shrink: 0;
            min-height: 65px;
        }
        .timeline-item:hover {
            background: rgba(255, 255, 255, 0.55);
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.1);
        }

        .timeline-icon {
            font-size: 1.8rem;
            flex-shrink: 0;
            width: 40px;
            text-align: center;
        }

        .timeline-content {
            flex: 1;
            min-width: 0;
        }
        .timeline-content .date {
            font-size: 0.7rem;
            color: #7a5a68;
            font-weight: 500;
            display: block;
            margin-bottom: 1px;
        }
        .timeline-content .title {
            font-size: clamp(0.95rem, 2.2vw, 1.05rem);
            font-weight: 700;
            color: #2d1b26;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.3;
        }
        .timeline-content .desc {
            font-size: clamp(0.8rem, 1.8vw, 0.9rem);
            color: #4f3a44;
            margin-top: 1px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.3;
        }

        .delete-btn {
            background: rgba(255, 0, 0, 0.1);
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 0.9rem;
            cursor: pointer;
            color: #e74c3c;
            transition: all 0.3s ease;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .delete-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            transform: scale(1.1);
        }

        .add-form {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 2px dashed rgba(255, 107, 157, 0.3);
            flex-shrink: 0;
        }
        .add-form .form-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .add-form input, .add-form select {
            padding: 8px 12px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            font-family: inherit;
            font-size: 0.9rem;
            color: #2d1b26;
            outline: none;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
        }
        .add-form input:focus, .add-form select:focus {
            border-color: #ff6b9d;
            background: rgba(255, 255, 255, 0.6);
        }
        .add-form input::placeholder {
            color: #8a7a82;
        }
        .add-form select option {
            color: #2d1b26;
        }

        .btn-add {
            padding: 8px 20px;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6b9d, #ee5a8b);
            color: #fff;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.4);
        }

        /* ===== دکمه‌های ناوبری داخل باکس ===== */
        .nav-links {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 14px;
            flex-shrink: 0;
        }
        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: 60px;
            font-family: inherit;
            font-size: clamp(0.85rem, 2vw, 0.95rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
            flex: 1;
            justify-content: center;
            min-width: 80px;
        }
        .nav-link-home {
            background: linear-gradient(135deg, #c084fc, #a855f7);
            box-shadow: 0 6px 18px rgba(192, 132, 252, 0.25);
        }
        .nav-link-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(192, 132, 252, 0.4);
        }
        .nav-link-gallery {
            background: linear-gradient(135deg, #ff6b9d, #ee5a8b);
            box-shadow: 0 6px 18px rgba(255, 107, 157, 0.25);
        }
        .nav-link-gallery:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(255, 107, 157, 0.4);
        }

        .empty-msg {
            text-align: center;
            color: #7a5a68;
            padding: 40px 0;
            font-size: 1rem;
        }
        .empty-msg span {
            font-size: 3rem;
            display: block;
            margin-bottom: 8px;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .app-container { min-height: 100vh; padding: 8px 0; }
            .glass-card { 
                padding: 18px 14px; 
                border-radius: 30px;
                max-height: 98vh;
            }
            .timeline-item { 
                padding: 10px 12px; 
                gap: 10px;
                min-height: 55px;
            }
            .timeline-icon { font-size: 1.5rem; width: 35px; }
            .timeline-list { gap: 8px; }
            .add-form .form-row { flex-direction: column; }
            .add-form input, .add-form select { min-width: 100%; }
            .btn-add { width: 100%; }
            .nav-link { 
                padding: 8px 16px; 
                font-size: 0.8rem;
                min-width: 60px;
            }
            .nav-links { gap: 6px; }
            .header { margin-bottom: 12px; }
            .header .emoji-big { font-size: 2.8rem; }
            .add-form { margin-top: 10px; padding-top: 10px; }
        }

        @media (max-width: 360px) {
            .glass-card { padding: 14px 10px; border-radius: 24px; }
            .timeline-item { padding: 8px 10px; min-height: 48px; }
            .timeline-icon { font-size: 1.2rem; width: 30px; }
            .timeline-content .title { font-size: 0.85rem; }
            .timeline-content .desc { font-size: 0.75rem; }
            .timeline-content .date { font-size: 0.6rem; }
            .delete-btn { width: 24px; height: 24px; font-size: 0.7rem; }
            .add-form input, .add-form select { padding: 6px 10px; font-size: 0.8rem; }
            .btn-add { padding: 6px 16px; font-size: 0.8rem; }
            .nav-link { padding: 6px 12px; font-size: 0.75rem; min-width: 50px; }
        }

        @media (min-height: 900px) {
            .timeline-list { max-height: 600px; }
        }
    </style>
</head>
<body>

    <div class="sticker">🌸</div>
    <div class="sticker">💖</div>
    <div class="sticker">🌺</div>
    <div class="sticker">💝</div>
    <div class="sticker">🌷</div>
    <div class="sticker">💗</div>

    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="app-container">
        <div class="glass-card">

            <div class="header">
                <span class="emoji-big">📖</span>
                <h1>خاطرات ما ❤️</h1>
                <p>هر لحظه با تو، یه خاطره‌ست...</p>
            </div>

            <div class="timeline-list" id="timelineList"></div>

            <div class="add-form">
                <div class="form-row">
                    <input type="text" id="newDate" placeholder="تاریخ">
                    <input type="text" id="newTitle" placeholder="عنوان">
                    <input type="text" id="newDesc" placeholder="توضیحات">
                    <select id="newIcon">
                        <option value="💕">💕</option>
                        <option value="❤️">❤️</option>
                        <option value="🌹">🌹</option>
                        <option value="😘">😘</option>
                        <option value="🎉">🎉</option>
                        <option value="🎂">🎂</option>
                        <option value="💖">💖</option>
                        <option value="💗">💗</option>
                        <option value="🌟">🌟</option>
                        <option value="✨">✨</option>
                        <option value="🔥">🔥</option>
                        <option value="💍">💍</option>
                        <option value="🏠">🏠</option>
                        <option value="✈️">✈️</option>
                        <option value="🎁">🎁</option>
                        <option value="📌">📌</option>
                    </select>
                    <button class="btn-add" onclick="addTimelineItem()">➕</button>
                </div>
            </div>

            <!-- ===== لینک‌های ناوبری داخل باکس ===== -->
            <div class="nav-links">
                <a href="index.html" class="nav-link nav-link-home">🏠 صفحه اصلی</a>
                <a href="gallery.html" class="nav-link nav-link-gallery">🖼️ گالری</a>
            </div>

        </div>
    </div>

    <script>
        const STORAGE_KEY = 'timelineData';

        function getDefaultData() {
            return [
                { id: 1, icon: '💕', date: '۲۵ جولای ۲۰۲۶', title: 'روزی که همدیگه رو دیدیم', desc: 'اولین بار که چشامون به هم افتاد ❤️' },
                { id: 2, icon: '🌹', date: '۱ آگوست ۲۰۲۶', title: 'قرار اول', desc: 'اولین قرار عاشقانه‌مون' },
                { id: 3, icon: '😘', date: '۸ آگوست ۲۰۲۶', title: 'اولین بوسه', desc: 'لحظه‌ای که دلم دیوونه شد' },
                { id: 4, icon: '❤️', date: '۱۵ آگوست ۲۰۲۶', title: 'ابراز عشق', desc: 'گفتم که عاشقتم و تو هم گفتی...' },
                { id: 5, icon: '🎉', date: '۲۵ آگوست ۲۰۲۶', title: 'یک ماهگی', desc: 'یک ماه گذشت و من هر روز بیشتر عاشقت میشم' }
            ];
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data && data.length > 0) return data;
                } catch (e) {}
            }
            return getDefaultData();
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        let timelineData = loadData();
        let nextId = timelineData.length > 0 ? Math.max(...timelineData.map(item => item.id)) + 1 : 1;

        function renderTimeline() {
            const list = document.getElementById('timelineList');
            if (timelineData.length === 0) {
                list.innerHTML = `<div class="empty-msg"><span>📭</span>هنوز خاطره‌ای ثبت نشده!<br>اولین خاطره‌ت رو اضافه کن ❤️</div>`;
                return;
            }
            list.innerHTML = timelineData.map(item => `
                <div class="timeline-item" data-id="${item.id}">
                    <div class="timeline-icon">${item.icon}</div>
                    <div class="timeline-content">
                        <span class="date">${item.date}</span>
                        <div class="title">${item.title}</div>
                        ${item.desc ? `<div class="desc">${item.desc}</div>` : ''}
                    </div>
                    <button class="delete-btn" onclick="deleteTimelineItem(${item.id})" title="حذف">✕</button>
                </div>
            `).join('');
        }

        function addTimelineItem() {
            const dateInput = document.getElementById('newDate');
            const titleInput = document.getElementById('newTitle');
            const descInput = document.getElementById('newDesc');
            const iconSelect = document.getElementById('newIcon');

            const date = dateInput.value.trim();
            const title = titleInput.value.trim();
            const desc = descInput.value.trim();
            const icon = iconSelect.value;

            if (!date || !title) {
                alert('لطفاً حداقل تاریخ و عنوان رو وارد کن! ❤️');
                return;
            }

            timelineData.push({ id: nextId++, icon, date, title, desc: desc || '' });
            saveData(timelineData);
            renderTimeline();

            dateInput.value = '';
            titleInput.value = '';
            descInput.value = '';
            iconSelect.value = '💕';

            const list = document.getElementById('timelineList');
            setTimeout(() => { list.scrollTop = list.scrollHeight; }, 50);
        }

        function deleteTimelineItem(id) {
            if (confirm('آیا مطمئنی میخوای این خاطره رو حذف کنی؟ 😢')) {
                timelineData = timelineData.filter(item => item.id !== id);
                saveData(timelineData);
                renderTimeline();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderTimeline();
            ['newDate', 'newTitle', 'newDesc'].forEach(id => {
                document.getElementById(id).addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') addTimelineItem();
                });
            });
        });
    </script>

</body>
</html>
