<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>خاطرات ما ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            height: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(145deg, #ffd6e0 0%, #fbc2eb 50%, #a18cd1 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        /* ===== استیکرها ===== */
        .sticker {
            position: fixed;
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            pointer-events: none;
            z-index: 2;
            animation: floatSticker 8s ease-in-out infinite;
            filter: drop-shadow(0 4px 12px rgba(255, 107, 157, 0.3));
            opacity: 0.6;
        }
        .sticker:nth-child(1) { top: 5%; left: 5%; animation-delay: 0s; font-size: clamp(2.5rem, 7vw, 5rem); }
        .sticker:nth-child(2) { top: 8%; right: 8%; animation-delay: 1.2s; }
        .sticker:nth-child(3) { bottom: 12%; left: 6%; animation-delay: 2.5s; }
        .sticker:nth-child(4) { bottom: 8%; right: 6%; animation-delay: 0.8s; font-size: clamp(3rem, 8vw, 5.5rem); }
        .sticker:nth-child(5) { top: 45%; left: 2%; animation-delay: 3.2s; font-size: clamp(1.8rem, 5vw, 3.5rem); opacity: 0.4; }
        .sticker:nth-child(6) { top: 40%; right: 2%; animation-delay: 1.8s; font-size: clamp(1.8rem, 5vw, 3.5rem); opacity: 0.4; }

        @keyframes floatSticker {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-15px) rotate(5deg) scale(1.05); }
            50% { transform: translateY(5px) rotate(-3deg) scale(0.95); }
            75% { transform: translateY(-10px) rotate(4deg) scale(1.02); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }

        /* ===== BUBBLES ===== */
        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            bottom: -60px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: rise linear infinite;
        }
        .bubble:nth-child(1) { width: 80px; height: 80px; left: 5%; animation-duration: 16s; }
        .bubble:nth-child(2) { width: 40px; height: 40px; left: 25%; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 110px; height: 110px; left: 45%; animation-duration: 22s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 60px; height: 60px; left: 70%; animation-duration: 14s; animation-delay: 1s; }
        .bubble:nth-child(5) { width: 90px; height: 90px; left: 88%; animation-duration: 19s; animation-delay: 3s; }
        @keyframes rise {
            0% { transform: translateY(0) scale(0.6); opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
        }

        /* ===== APP ===== */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 44px;
            padding: 30px 24px;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.08);
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header .emoji-big {
            font-size: clamp(3.5rem, 10vw, 4.5rem);
            display: block;
            margin-bottom: 6px;
            animation: gentle-pulse 2.4s infinite;
        }
        @keyframes gentle-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .header h1 {
            color: #2d1b26;
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            font-weight: 900;
            margin-bottom: 4px;
        }
        .header p {
            color: #4f3a44;
            font-size: clamp(0.9rem, 2.5vw, 1.05rem);
        }

        /* ===== لیست تایم‌لاین ===== */
        .timeline-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
            max-height: 400px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 4px;
        }
        .timeline-list::-webkit-scrollbar {
            width: 4px;
        }
        .timeline-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
        .timeline-list::-webkit-scrollbar-thumb {
            background: #ff6b9d;
            border-radius: 10px;
        }

        .timeline-item {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .timeline-item:hover {
            background: rgba(255, 255, 255, 0.55);
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.1);
        }

        .timeline-icon {
            font-size: 2rem;
            flex-shrink: 0;
            width: 45px;
            text-align: center;
        }

        .timeline-content {
            flex: 1;
            min-width: 0;
        }
        .timeline-content .date {
            font-size: 0.75rem;
            color: #7a5a68;
            font-weight: 500;
            display: block;
            margin-bottom: 2px;
        }
        .timeline-content .title {
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            font-weight: 700;
            color: #2d1b26;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .timeline-content .desc {
            font-size: clamp(0.85rem, 2vw, 0.95rem);
            color: #4f3a44;
            margin-top: 2px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* ===== دکمه حذف ===== */
        .delete-btn {
            background: rgba(255, 0, 0, 0.1);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 1rem;
            cursor: pointer;
            color: #e74c3c;
            transition: all 0.3s ease;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .delete-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            transform: scale(1.1);
        }

        /* ===== فرم اضافه کردن ===== */
        .add-form {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 2px dashed rgba(255, 107, 157, 0.3);
        }
        .add-form .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .add-form input, .add-form select {
            padding: 10px 14px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            font-family: inherit;
            font-size: 0.95rem;
            color: #2d1b26;
            outline: none;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
        }
        .add-form input:focus, .add-form select:focus {
            border-color: #ff6b9d;
            background: rgba(255, 255, 255, 0.6);
        }
        .add-form input::placeholder {
            color: #8a7a82;
        }
        .add-form select option {
            color: #2d1b26;
        }

        .btn-add {
            padding: 10px 24px;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6b9d, #ee5a8b);
            color: #fff;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.4);
        }

        /* ===== دکمه برگشت ===== */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border: none;
            border-radius: 60px;
            font-family: inherit;
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #c084fc, #a855f7);
            color: #fff;
            box-shadow: 0 6px 18px rgba(192, 132, 252, 0.25);
            transition: all 0.3s ease;
            text-decoration: none;
            margin-top: 16px;
        }
        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(192, 132, 252, 0.4);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .empty-msg {
            text-align: center;
            color: #7a5a68;
            padding: 30px 0;
            font-size: 1.1rem;
        }
        .empty-msg span {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            body { padding: 10px; }
            .app-container { min-height: 70vh; }
            .glass-card { padding: 20px 16px; border-radius: 32px; }
            .timeline-item { padding: 12px 14px; gap: 10px; }
            .timeline-icon { font-size: 1.6rem; width: 38px; }
            .add-form .form-row { flex-direction: column; }
            .add-form input, .add-form select { min-width: 100%; }
            .btn-add { width: 100%; }
            .back-btn { padding: 10px 22px; font-size: 0.95rem; width: 100%; justify-content: center; }
        }

        @media (max-width: 360px) {
            .glass-card { padding: 16px 12px; border-radius: 28px; }
            .timeline-item { padding: 10px 12px; }
            .timeline-icon { font-size: 1.3rem; width: 32px; }
        }
    </style>
</head>
<body>

    <!-- ===== استیکرها ===== -->
    <div class="sticker">🌸</div>
    <div class="sticker">💖</div>
    <div class="sticker">🌺</div>
    <div class="sticker">💝</div>
    <div class="sticker">🌷</div>
    <div class="sticker">💗</div>

    <!-- ===== BUBBLES ===== -->
    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <!-- ===== APP ===== -->
    <div class="app-container">
        <div class="glass-card">

            <!-- هدر -->
            <div class="header">
                <span class="emoji-big">📖</span>
                <h1>خاطرات ما ❤️</h1>
                <p>هر لحظه با تو، یه خاطره‌ست...</p>
            </div>

            <!-- ===== لیست دیت‌ها ===== -->
            <div class="timeline-list" id="timelineList">
                <!-- آیتم‌ها توسط جاوااسکریپت ساخته میشن -->
            </div>

            <!-- ===== فرم اضافه کردن دیت جدید ===== -->
            <div class="add-form">
                <div class="form-row">
                    <input type="text" id="newDate" placeholder="تاریخ (مثلاً ۲۵ جولای ۲۰۲۶)">
                    <input type="text" id="newTitle" placeholder="عنوان (مثلاً قرار اول)">
                    <input type="text" id="newDesc" placeholder="توضیحات (اختیاری)">
                    <select id="newIcon">
                        <option value="💕">💕</option>
                        <option value="❤️">❤️</option>
                        <option value="🌹">🌹</option>
                        <option value="😘">😘</option>
                        <option value="🎉">🎉</option>
                        <option value="🎂">🎂</option>
                        <option value="💖">💖</option>
                        <option value="💗">💗</option>
                        <option value="🌟">🌟</option>
                        <option value="✨">✨</option>
                        <option value="🔥">🔥</option>
                        <option value="💍">💍</option>
                        <option value="🏠">🏠</option>
                        <option value="✈️">✈️</option>
                        <option value="🎁">🎁</option>
                        <option value="📌">📌</option>
                    </select>
                    <button class="btn-add" onclick="addTimelineItem()">➕ اضافه کن</button>
                </div>
            </div>

            <!-- ===== دکمه برگشت به صفحه اصلی ===== -->
            <div class="btn-group">
                <a href="index.html" class="back-btn">⬅️ برگشت به صفحه اصلی</a>
            </div>

        </div>
    </div>

    <script>
        // ============================================
        // ذخیره‌سازی با localStorage
        // ============================================
        
        const STORAGE_KEY = 'timelineData';

        // ===== داده‌های پیش‌فرض =====
        function getDefaultData() {
            return [
                {
                    id: 1,
                    icon: '💕',
                    date: '۲۵ جولای ۲۰۲۶',
                    title: 'روزی که همدیگه رو دیدیم',
                    desc: 'اولین بار که چشامون به هم افتاد ❤️'
                },
                {
                    id: 2,
                    icon: '🌹',
                    date: '۱ آگوست ۲۰۲۶',
                    title: 'قرار اول',
                    desc: 'اولین قرار عاشقانه‌مون'
                },
                {
                    id: 3,
                    icon: '😘',
                    date: '۸ آگوست ۲۰۲۶',
                    title: 'اولین بوسه',
                    desc: 'لحظه‌ای که دلم دیوونه شد'
                },
                {
                    id: 4,
                    icon: '❤️',
                    date: '۱۵ آگوست ۲۰۲۶',
                    title: 'ابراز عشق',
                    desc: 'گفتم که عاشقتم و تو هم گفتی...'
                },
                {
                    id: 5,
                    icon: '🎉',
                    date: '۲۵ آگوست ۲۰۲۶',
                    title: 'یک ماهگی',
                    desc: 'یک ماه گذشت و من هر روز بیشتر عاشقت میشم'
                }
            ];
        }

        // ===== بارگذاری داده از localStorage =====
        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data && data.length > 0) {
                        return data;
                    }
                } catch (e) {
                    console.log('خطا در بارگذاری داده');
                }
            }
            // اگر داده‌ای نبود، داده‌های پیش‌فرض رو برمیگردونه
            return getDefaultData();
        }

        // ===== ذخیره داده در localStorage =====
        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        // ===== متغیر اصلی =====
        let timelineData = loadData();
        let nextId = timelineData.length > 0 ? Math.max(...timelineData.map(item => item.id)) + 1 : 1;

        // ===== رندر کردن لیست =====
        function renderTimeline() {
            const list = document.getElementById('timelineList');
            
            if (timelineData.length === 0) {
                list.innerHTML = `
                    <div class="empty-msg">
                        <span>📭</span>
                        هنوز خاطره‌ای ثبت نشده!<br>
                        اولین خاطره‌ت رو اضافه کن ❤️
                    </div>
                `;
                return;
            }

            list.innerHTML = timelineData.map(item => `
                <div class="timeline-item" data-id="${item.id}">
                    <div class="timeline-icon">${item.icon}</div>
                    <div class="timeline-content">
                        <span class="date">${item.date}</span>
                        <div class="title">${item.title}</div>
                        ${item.desc ? `<div class="desc">${item.desc}</div>` : ''}
                    </div>
                    <button class="delete-btn" onclick="deleteTimelineItem(${item.id})" title="حذف">✕</button>
                </div>
            `).join('');
        }

        // ===== اضافه کردن آیتم جدید =====
        function addTimelineItem() {
            const dateInput = document.getElementById('newDate');
            const titleInput = document.getElementById('newTitle');
            const descInput = document.getElementById('newDesc');
            const iconSelect = document.getElementById('newIcon');

            const date = dateInput.value.trim();
            const title = titleInput.value.trim();
            const desc = descInput.value.trim();
            const icon = iconSelect.value;

            if (!date || !title) {
                alert('لطفاً حداقل تاریخ و عنوان رو وارد کن! ❤️');
                return;
            }

            const newItem = {
                id: nextId++,
                icon: icon,
                date: date,
                title: title,
                desc: desc || ''
            };

            timelineData.push(newItem);
            saveData(timelineData);  // ذخیره در localStorage
            renderTimeline();

            // پاک کردن فیلدها
            dateInput.value = '';
            titleInput.value = '';
            descInput.value = '';
            iconSelect.value = '💕';

            // اسکرول به پایین لیست
            const list = document.getElementById('timelineList');
            list.scrollTop = list.scrollHeight;
        }

        // ===== حذف آیتم =====
        function deleteTimelineItem(id) {
            if (confirm('آیا مطمئنی میخوای این خاطره رو حذف کنی؟ 😢')) {
                timelineData = timelineData.filter(item => item.id !== id);
                saveData(timelineData);  // ذخیره در localStorage
                renderTimeline();
            }
        }

        // ===== تنظیمات اولیه =====
        document.addEventListener('DOMContentLoaded', function() {
            renderTimeline();

            // اضافه کردن با Enter
            const inputs = ['newDate', 'newTitle', 'newDesc'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        addTimelineItem();
                    }
                });
            });
        });
    </script>

</body>
</html>
