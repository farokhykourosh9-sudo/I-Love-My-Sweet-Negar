<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>گالری عشق ما ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            height: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(145deg, #ffd6e0 0%, #fbc2eb 50%, #a18cd1 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .sticker {
            position: fixed;
            font-size: clamp(2rem, 6vw, 4rem);
            pointer-events: none;
            z-index: 2;
            animation: floatSticker 8s ease-in-out infinite;
            filter: drop-shadow(0 4px 12px rgba(255, 107, 157, 0.3));
            opacity: 0.6;
        }
        .sticker:nth-child(1) { top: 5%; left: 5%; animation-delay: 0s; font-size: clamp(2.5rem, 7vw, 5rem); }
        .sticker:nth-child(2) { top: 8%; right: 8%; animation-delay: 1.2s; }
        .sticker:nth-child(3) { bottom: 12%; left: 6%; animation-delay: 2.5s; }
        .sticker:nth-child(4) { bottom: 8%; right: 6%; animation-delay: 0.8s; font-size: clamp(3rem, 8vw, 5.5rem); }

        @keyframes floatSticker {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-15px) rotate(5deg) scale(1.05); }
            50% { transform: translateY(5px) rotate(-3deg) scale(0.95); }
            75% { transform: translateY(-10px) rotate(4deg) scale(1.02); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }

        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            bottom: -60px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            animation: rise linear infinite;
        }
        .bubble:nth-child(1) { width: 80px; height: 80px; left: 5%; animation-duration: 16s; }
        .bubble:nth-child(2) { width: 40px; height: 40px; left: 25%; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 110px; height: 110px; left: 45%; animation-duration: 22s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 60px; height: 60px; left: 70%; animation-duration: 14s; animation-delay: 1s; }
        .bubble:nth-child(5) { width: 90px; height: 90px; left: 88%; animation-duration: 19s; animation-delay: 3s; }
        @keyframes rise {
            0% { transform: translateY(0) scale(0.6); opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 44px;
            padding: 24px 18px;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.08);
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 14px;
            flex-shrink: 0;
        }
        .header .emoji-big {
            font-size: clamp(3rem, 9vw, 4rem);
            display: block;
            margin-bottom: 4px;
            animation: gentle-pulse 2.4s infinite;
        }
        @keyframes gentle-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .header h1 {
            color: #2d1b26;
            font-size: clamp(1.3rem, 4.5vw, 2rem);
            font-weight: 900;
            margin-bottom: 2px;
        }
        .header p {
            color: #4f3a44;
            font-size: clamp(0.85rem, 2.2vw, 1rem);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 2px;
            min-height: 150px;
            max-height: 450px;
            align-content: start;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .gallery-grid::-webkit-scrollbar {
            width: 5px;
        }
        .gallery-grid::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
        .gallery-grid::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            border-radius: 10px;
        }
        .gallery-grid::-webkit-scrollbar-thumb:hover {
            background: #ff6b9d;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70px;
        }
        .gallery-item:hover {
            transform: scale(1.05);
            border-color: #ff6b9d;
            box-shadow: 0 8px 30px rgba(255, 107, 157, 0.3);
            z-index: 5;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .gallery-item .empty-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #7a5a68;
            font-size: 0.7rem;
            opacity: 0.5;
            text-align: center;
            padding: 8px;
            pointer-events: none;
        }
        .gallery-item .empty-box span {
            font-size: 2rem;
            display: block;
            margin-bottom: 2px;
        }

        .delete-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(255, 0, 0, 0.85);
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 0.7rem;
            color: #fff;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.3s ease;
        }
        .gallery-item:hover .delete-btn {
            display: flex;
        }
        .delete-btn:hover {
            transform: scale(1.2);
            background: red;
        }

        .upload-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 60px;
            font-family: inherit;
            font-size: clamp(0.95rem, 2.5vw, 1.05rem);
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6b9d, #ee5a8b);
            color: #fff;
            box-shadow: 0 6px 18px rgba(255, 107, 157, 0.25);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .upload-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(255, 107, 157, 0.4);
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 12px;
            flex-shrink: 0;
            padding-top: 12px;
            border-top: 2px dashed rgba(255, 107, 157, 0.3);
        }
        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            border-radius: 60px;
            font-family: inherit;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
            flex: 1;
            justify-content: center;
            min-width: 70px;
        }
        .nav-btn-secondary {
            background: linear-gradient(135deg, #c084fc, #a855f7);
            box-shadow: 0 6px 18px rgba(192, 132, 252, 0.25);
        }
        .nav-btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(192, 132, 252, 0.4);
        }

        #fileInput {
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .modal.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }
        .modal-close {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.6rem;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .empty-gallery {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: #7a5a68;
        }
        .empty-gallery span {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 12px;
        }
        .empty-gallery p {
            font-size: 1rem;
        }
        .empty-gallery .sub {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            body { padding: 8px; }
            .app-container { min-height: 100vh; padding: 8px 0; }
            .glass-card { 
                padding: 16px 12px; 
                border-radius: 30px;
            }
            .gallery-grid {
                gap: 6px;
                min-height: 120px;
                max-height: 300px;
                padding: 4px;
                border-radius: 12px;
            }
            .gallery-item {
                border-radius: 12px;
                min-height: 55px;
                border-width: 2px;
            }
            .gallery-item .empty-box span { font-size: 1.5rem; }
            .gallery-item .empty-box { font-size: 0.6rem; }
            .nav-btn {
                padding: 6px 12px;
                font-size: 0.75rem;
                min-width: 50px;
            }
            .nav-buttons {
                gap: 4px;
                margin-top: 10px;
                padding-top: 10px;
            }
            .modal img {
                max-width: 95%;
                max-height: 70vh;
            }
            .modal-close {
                width: 36px;
                height: 36px;
                font-size: 1.2rem;
                top: 12px;
                left: 12px;
            }
            .upload-btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
            .delete-btn {
                width: 22px;
                height: 22px;
                font-size: 0.6rem;
                top: 3px;
                right: 3px;
            }
            .header .emoji-big { font-size: 2.5rem; }
            .header { margin-bottom: 10px; }
            .empty-gallery { padding: 30px 15px; }
            .empty-gallery span { font-size: 2.8rem; }
            .empty-gallery p { font-size: 0.9rem; }
        }

        @media (max-width: 360px) {
            .glass-card { padding: 12px 8px; border-radius: 24px; }
            .gallery-grid { gap: 4px; min-height: 100px; max-height: 250px; }
            .gallery-item { min-height: 45px; border-radius: 10px; }
            .gallery-item .empty-box span { font-size: 1.2rem; }
            .nav-btn { padding: 4px 8px; font-size: 0.65rem; min-width: 40px; }
            .upload-btn { padding: 6px 12px; font-size: 0.75rem; }
            .delete-btn { width: 18px; height: 18px; font-size: 0.5rem; }
        }

        @media (min-width: 768px) {
            .gallery-grid { max-height: 550px; min-height: 200px; }
        }
    </style>
</head>
<body>

    <div class="sticker">🌸</div>
    <div class="sticker">💖</div>
    <div class="sticker">🌺</div>
    <div class="sticker">💝</div>

    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="app-container">
        <div class="glass-card">

            <div class="header">
                <span class="emoji-big">🖼️</span>
                <h1>گالری عشق ما ❤️</h1>
                <p>هر عکس، یه خاطره‌ست...</p>
            </div>

            <div class="gallery-grid" id="galleryGrid"></div>

            <div class="nav-buttons">
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                    📸 اضافه کردن عکس
                </button>
                <a href="index.html" class="nav-btn nav-btn-secondary">🏠 صفحه اصلی</a>
                <a href="timeline.html" class="nav-btn nav-btn-secondary">📖 خاطرات</a>
            </div>

            <input type="file" id="fileInput" accept="image/*" multiple>

        </div>
    </div>

    <div class="modal" id="imageModal" onclick="closeModal()">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <img id="modalImage" src="" alt="عکس">
    </div>

    <script>
        const GALLERY_KEY = 'galleryImages';

        function loadImages() {
            const saved = localStorage.getItem(GALLERY_KEY);
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {
                    return [];
                }
            }
            return [];
        }

        function saveImages(images) {
            localStorage.setItem(GALLERY_KEY, JSON.stringify(images));
        }

        let galleryImages = loadImages();

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            
            if (galleryImages.length === 0) {
                grid.innerHTML = `
                    <div class="empty-gallery">
                        <span>📭</span>
                        <p>هنوز عکسی اضافه نشده!</p>
                        <p class="sub">روی دکمه "اضافه کردن عکس" کلیک کن ❤️</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = galleryImages.map((img, index) => `
                <div class="gallery-item" onclick="openImage(${index})">
                    <img src="${img}" alt="عکس ${index + 1}" loading="lazy">
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteImage(${index})">✕</button>
                </div>
            `).join('');
        }

        // ===== آپلود عکس =====
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files.length) return;

            let loadedCount = 0;
            const totalFiles = files.length;

            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) {
                    loadedCount++;
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    galleryImages.push(event.target.result);
                    loadedCount++;
                    
                    // وقتی همه عکس‌ها بارگذاری شدن
                    if (loadedCount === totalFiles) {
                        saveImages(galleryImages);
                        renderGallery();
                        // اسکرول به پایین
                        const grid = document.getElementById('galleryGrid');
                        setTimeout(() => { grid.scrollTop = grid.scrollHeight; }, 100);
                    }
                };
                reader.onerror = function() {
                    loadedCount++;
                    if (loadedCount === totalFiles) {
                        saveImages(galleryImages);
                        renderGallery();
                    }
                };
                reader.readAsDataURL(file);
            });
            
            this.value = '';
        });

        function deleteImage(index) {
            if (confirm('آیا مطمئنی میخوای این عکس رو حذف کنی؟ 😢')) {
                galleryImages.splice(index, 1);
                saveImages(galleryImages);
                renderGallery();
            }
        }

        function openImage(index) {
            const img = galleryImages[index];
            if (!img) return;
            
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = img;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        document.addEventListener('DOMContentLoaded', function() {
            renderGallery();
        });
    </script>

</body>
</html>
