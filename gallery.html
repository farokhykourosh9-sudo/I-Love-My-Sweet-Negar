<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>گالری عشق ما ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            height: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(145deg, #ffd6e0 0%, #fbc2eb 50%, #a18cd1 100%);
            z-index: -1;
        }

        .sticker {
            position: fixed;
            font-size: clamp(1.5rem, 4vw, 3rem);
            pointer-events: none;
            z-index: 2;
            animation: floatSticker 8s ease-in-out infinite;
            filter: drop-shadow(0 4px 12px rgba(255, 107, 157, 0.3));
            opacity: 0.4;
        }

        .sticker:nth-child(1) { top: 3%; left: 3%; animation-delay: 0s; font-size: clamp(2rem, 5vw, 3.5rem); }
        .sticker:nth-child(2) { top: 5%; right: 5%; animation-delay: 1.2s; }
        .sticker:nth-child(3) { bottom: 8%; left: 4%; animation-delay: 2.5s; }
        .sticker:nth-child(4) { bottom: 5%; right: 4%; animation-delay: 0.8s; font-size: clamp(2.2rem, 6vw, 4rem); }

        @keyframes floatSticker {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-10px) rotate(5deg) scale(1.05); }
            50% { transform: translateY(5px) rotate(-3deg) scale(0.95); }
            75% { transform: translateY(-8px) rotate(4deg) scale(1.02); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }

        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: rise linear infinite;
        }

        .bubble:nth-child(1) { width: 60px; height: 60px; left: 5%; animation-duration: 16s; }
        .bubble:nth-child(2) { width: 30px; height: 30px; left: 25%; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 80px; height: 80px; left: 45%; animation-duration: 22s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 45px; height: 45px; left: 70%; animation-duration: 14s; animation-delay: 1s; }
        .bubble:nth-child(5) { width: 70px; height: 70px; left: 88%; animation-duration: 19s; animation-delay: 3s; }

        @keyframes rise {
            0% { transform: translateY(0) scale(0.6); opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 8px 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            padding: 18px 14px;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.06);
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .header .emoji-big {
            font-size: clamp(2.8rem, 8vw, 3.8rem);
            display: block;
            margin-bottom: 2px;
            animation: gentle-pulse 2.4s infinite;
        }

        @keyframes gentle-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .header h1 {
            color: #2d1b26;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 900;
            margin-bottom: 1px;
        }

        .header p {
            color: #4f3a44;
            font-size: clamp(0.8rem, 2vw, 0.95rem);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 2px;
            min-height: 150px;
            max-height: 420px;
            align-content: start;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .gallery-grid::-webkit-scrollbar {
            width: 4px;
        }

        .gallery-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .gallery-grid::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            border-radius: 10px;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70px;
        }

        .gallery-item:hover {
            transform: scale(1.03);
            border-color: #ff6b9d;
            box-shadow: 0 8px 30px rgba(255, 107, 157, 0.25);
            z-index: 5;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 12px;
            flex-shrink: 0;
            padding-top: 12px;
            border-top: 1.5px dashed rgba(255, 107, 157, 0.25);
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
            flex: 1;
            justify-content: center;
            min-width: 70px;
        }

        .nav-btn-secondary {
            background: linear-gradient(135deg, #c084fc, #a855f7);
            box-shadow: 0 4px 15px rgba(192, 132, 252, 0.2);
        }

        .nav-btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(192, 132, 252, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        .modal-close {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.6rem;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        @media (max-width: 480px) {
            body { padding: 6px; }
            .glass-card { padding: 14px 10px; border-radius: 28px; }
            .gallery-grid { gap: 6px; min-height: 120px; max-height: 300px; padding: 4px; border-radius: 12px; }
            .gallery-item { border-radius: 12px; min-height: 55px; border-width: 2px; }
            .nav-btn { padding: 6px 12px; font-size: 0.75rem; min-width: 50px; }
            .nav-buttons { gap: 4px; margin-top: 10px; padding-top: 10px; }
            .modal img { max-width: 95%; max-height: 70vh; }
            .modal-close { width: 36px; height: 36px; font-size: 1.2rem; top: 12px; left: 12px; }
            .header .emoji-big { font-size: 2.5rem; }
            .header { margin-bottom: 10px; }
        }

        @media (max-width: 360px) {
            .glass-card { padding: 10px 8px; border-radius: 24px; }
            .gallery-grid { gap: 4px; min-height: 100px; max-height: 250px; }
            .gallery-item { min-height: 45px; border-radius: 10px; }
            .nav-btn { padding: 4px 10px; font-size: 0.65rem; min-width: 40px; }
        }

        @media (min-width: 768px) {
            .gallery-grid { max-height: 500px; min-height: 200px; }
        }
    </style>
</head>
<body>

    <div class="sticker">🌸</div>
    <div class="sticker">💖</div>
    <div class="sticker">🌺</div>
    <div class="sticker">💝</div>

    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="app-container">
        <div class="glass-card">

            <div class="header">
                <span class="emoji-big">🖼️</span>
                <h1>گالری عشق ما ❤️</h1>
                <p>هر عکس، یه خاطره‌ست...</p>
            </div>

            <div class="gallery-grid" id="galleryGrid">
                <!-- عکس‌ها توسط جاوااسکریپت ساخته میشن -->
            </div>

            <div class="nav-buttons">
                <a href="index.html" class="nav-btn nav-btn-secondary">🏠 صفحه اصلی</a>
                <a href="timeline.html" class="nav-btn nav-btn-secondary">📖 خاطرات</a>
            </div>

        </div>
    </div>

    <div class="modal" id="imageModal" onclick="closeModal()">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <img id="modalImage" src="" alt="عکس">
    </div>

    <script>
        // ============================================
        // لیست لینک‌های عکس‌ها (لینک‌های شما)
        // ============================================
        
        const galleryImages = [
            'https://uploadkon.ir/uploads/dedf02_26ChatGPT-Image-Aug-2-2026-04-49-21-PM.png',
            'https://uploadkon.ir/uploads/f18f02_26ChatGPT-Image-Jul-29-2026-12-17-55-AM.png'
        ];

        // ============================================
        // رندر گالری
        // ============================================
        
        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            
            if (galleryImages.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:40px 20px; color:#7a5a68;">
                        <span style="font-size:3.5rem; display:block; margin-bottom:12px;">📭</span>
                        <p>هنوز عکسی اضافه نشده!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = galleryImages.map((img, index) => `
                <div class="gallery-item" onclick="openImage(${index})">
                    <img src="${img}" alt="عکس ${index + 1}" loading="lazy">
                </div>
            `).join('');
        }

        // ============================================
        // باز کردن عکس در Modal
        // ============================================
        
        function openImage(index) {
            const img = galleryImages[index];
            if (!img) return;
            
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = img;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================
        // بارگذاری اولیه
        // ============================================
        
        document.addEventListener('DOMContentLoaded', function() {
            renderGallery();
        });
    </script>

</body>
</html>
