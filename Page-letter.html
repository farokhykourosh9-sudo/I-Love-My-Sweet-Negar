<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>نامه‌های عاشقانه ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            height: 100%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
            background: linear-gradient(145deg, #ffd6e0 0%, #fbc2eb 50%, #a18cd1 100%);
        }

        /* ===== گرادیان ثابت ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(145deg, #ffd6e0 0%, #fbc2eb 50%, #a18cd1 100%);
            z-index: -1;
        }

        /* ===== استیکرها ===== */
        .sticker {
            position: fixed;
            font-size: clamp(1.5rem, 4vw, 3rem);
            pointer-events: none;
            z-index: 2;
            animation: floatSticker 8s ease-in-out infinite;
            filter: drop-shadow(0 4px 12px rgba(255, 107, 157, 0.3));
            opacity: 0.3;
        }
        .sticker:nth-child(1) { top: 3%; left: 3%; animation-delay: 0s; font-size: clamp(2rem, 5vw, 3.5rem); }
        .sticker:nth-child(2) { top: 5%; right: 5%; animation-delay: 1.2s; }
        .sticker:nth-child(3) { bottom: 8%; left: 4%; animation-delay: 2.5s; }
        .sticker:nth-child(4) { bottom: 5%; right: 4%; animation-delay: 0.8s; font-size: clamp(2.2rem, 6vw, 4rem); }
        .sticker:nth-child(5) { top: 45%; left: 2%; animation-delay: 3.2s; font-size: 1.2rem; opacity: 0.2; }
        .sticker:nth-child(6) { top: 40%; right: 2%; animation-delay: 1.8s; font-size: 1.2rem; opacity: 0.2; }

        @keyframes floatSticker {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-10px) rotate(5deg) scale(1.05); }
            50% { transform: translateY(5px) rotate(-3deg) scale(0.95); }
            75% { transform: translateY(-8px) rotate(4deg) scale(1.02); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }

        /* ===== حباب‌ها ===== */
        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            bottom: -60px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            animation: rise linear infinite;
        }
        .bubble:nth-child(1) { width: 60px; height: 60px; left: 5%; animation-duration: 16s; }
        .bubble:nth-child(2) { width: 30px; height: 30px; left: 25%; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 80px; height: 80px; left: 45%; animation-duration: 22s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 45px; height: 45px; left: 70%; animation-duration: 14s; animation-delay: 1s; }
        .bubble:nth-child(5) { width: 70px; height: 70px; left: 88%; animation-duration: 19s; animation-delay: 3s; }
        @keyframes rise {
            0% { transform: translateY(0) scale(0.6); opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
        }

        /* ===== کانتینر اصلی ===== */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        /* ===== عنوان ===== */
        .page-title {
            text-align: center;
            margin-bottom: 30px;
            color: #2d1b26;
        }
        .page-title h1 {
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            font-weight: 900;
            margin-bottom: 4px;
        }
        .page-title p {
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            color: #4f3a44;
            opacity: 0.7;
        }

        /* ===== جعبه سه‌بعدی ===== */
        .box-container {
            perspective: 800px;
            width: 200px;
            height: 200px;
            margin: 0 auto 40px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .box-container:active {
            transform: scale(0.95);
        }

        .box-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: boxFloat 3s ease-in-out infinite;
        }

        @keyframes boxFloat {
            0%, 100% { transform: rotateX(-10deg) rotateY(-15deg) translateY(0px); }
            50% { transform: rotateX(-10deg) rotateY(-15deg) translateY(-10px); }
        }

        /* روی جعبه (رو) */
        .box-face-top {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #ff6b9d, #d94a7a);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.4), 
                        inset 0 -5px 20px rgba(0,0,0,0.1);
            transform: rotateX(0deg) translateZ(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .box-face-top .heart-icon {
            font-size: 5rem;
            animation: heartBeat 1.5s ease-in-out infinite;
            filter: drop-shadow(0 4px 20px rgba(255,255,255,0.3));
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
        }

        /* لبه‌های جعبه */
        .box-face-top::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(255,255,255,0.4), transparent);
            z-index: -1;
        }

        /* کتیبه روی جعبه */
        .box-label {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.8);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.15);
            padding: 4px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        /* ===== نامه ===== */
        .letter-container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 24px 20px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .letter-container.hidden-letter {
            opacity: 0.5;
            min-height: 100px;
            justify-content: center;
        }

        .letter-container .letter-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
            opacity: 0.6;
        }

        .letter-container .letter-text {
            font-size: clamp(1rem, 2.8vw, 1.3rem);
            color: #2d1b26;
            text-align: center;
            line-height: 2;
            font-weight: 500;
            padding: 8px 0;
            word-wrap: break-word;
        }

        .letter-container .letter-number {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 0.7rem;
            color: #7a5a68;
            opacity: 0.5;
            font-weight: 700;
        }

        .letter-container .hint-text {
            color: #7a5a68;
            font-size: 0.9rem;
            opacity: 0.6;
        }

        /* ===== دکمه‌های ناوبری ===== */
        .nav-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 24px;
            width: 100%;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-size: clamp(0.85rem, 2.2vw, 0.95rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
            flex: 1;
            justify-content: center;
            min-width: 70px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .nav-btn-primary {
            background: linear-gradient(135deg, #ff6b9d, #ee5a8b);
        }
        .nav-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.3);
        }

        .nav-btn-secondary {
            background: linear-gradient(135deg, #c084fc, #a855f7);
        }
        .nav-btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(192, 132, 252, 0.3);
        }

        .nav-btn-home {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        .nav-btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.3);
        }

        /* ===== ریزش قلب و گل ===== */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            top: -50px;
            font-size: 2rem;
            animation: confettiFall linear forwards;
            opacity: 0;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .box-container {
                width: 160px;
                height: 160px;
            }
            .box-face-top .heart-icon {
                font-size: 4rem;
            }
            .box-label {
                font-size: 0.6rem;
                bottom: 18px;
                padding: 3px 12px;
            }
            .letter-container {
                padding: 18px 16px;
                min-height: 130px;
                border-radius: 20px;
            }
            .letter-container .letter-text {
                font-size: 0.95rem;
                line-height: 1.8;
            }
            .nav-btn {
                padding: 8px 14px;
                font-size: 0.75rem;
                min-width: 50px;
            }
            .page-title h1 {
                font-size: 1.3rem;
            }
            .sticker {
                opacity: 0.2 !important;
            }
        }

        @media (max-width: 360px) {
            .box-container {
                width: 130px;
                height: 130px;
            }
            .box-face-top .heart-icon {
                font-size: 3rem;
            }
            .letter-container .letter-text {
                font-size: 0.85rem;
            }
            .letter-container {
                padding: 14px 12px;
                min-height: 110px;
            }
        }

        @media (min-width: 600px) {
            .box-container {
                width: 240px;
                height: 240px;
            }
            .box-face-top .heart-icon {
                font-size: 6rem;
            }
        }
    </style>
</head>
<body>

    <!-- استیکرها -->
    <div class="sticker">🌸</div>
    <div class="sticker">💖</div>
    <div class="sticker">🌺</div>
    <div class="sticker">💝</div>
    <div class="sticker">🌷</div>
    <div class="sticker">💗</div>

    <!-- حباب‌ها -->
    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <!-- کانتینر اصلی -->
    <div class="app-container">
        
        <!-- عنوان -->
        <div class="page-title">
            <h1>📬 صندوق عاشقانه</h1>
            <p>روی جعبه بزن تا نامه‌ات رو بخونی...</p>
        </div>

        <!-- جعبه سه‌بعدی -->
        <div class="box-container" id="boxContainer" onclick="openLetter()">
            <div class="box-3d" id="box3d">
                <div class="box-face-top">
                    <span class="heart-icon">❤️</span>
                    <span class="box-label">💌 بزن روی من</span>
                </div>
            </div>
        </div>

        <!-- نامه -->
        <div class="letter-container hidden-letter" id="letterContainer">
            <span class="letter-icon">✉️</span>
            <div class="letter-text" id="letterText">
                <span class="hint-text">روی جعبه بزن تا اولین نامه‌ات رو بخونی...</span>
            </div>
            <span class="letter-number" id="letterNumber"></span>
        </div>

        <!-- دکمه‌های ناوبری -->
        <div class="nav-buttons">
            <a href="index.html" class="nav-btn nav-btn-home">🏠 صفحه اصلی</a>
            <a href="timeline.html" class="nav-btn nav-btn-secondary">📖 خاطرات</a>
            <a href="gallery.html" class="nav-btn nav-btn-primary">🖼️ گالری</a>
            <a href="events.html" class="nav-btn" style="background: linear-gradient(135deg, #fbbf24, #f59e0b);">📅 رویدادها</a>
        </div>

    </div>

    <!-- کانتینر ریزش قلب و گل -->
    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        // ============================================
        // لیست نامه‌ها
        // ============================================
        
        const letters = [
            { text: 'کوری خیلی دوست داره هاااا روانیییییی', number: 1 },
            { text: 'دستت راستت رو بزار رو چپ سینت، آخخخ آروم تر دردم گرفت 🫠☺️', number: 2 },
            { text: 'من همونم که فقط با بوس کردن گردنت ریتم ضربان قلبت رو بهم میریزم ❤️‍🔥', number: 3 },
            { text: 'به بابات گفتی برای دختر کوچیکش یه خاطرخواه تو راهه که هنوز خبر نداره ؟ 😌', number: 4 },
            { text: 'کثافتتت روانیییییی، دیونههه من که دوست دارممم 😄🫠🥺', number: 5 },
            { text: 'می‌دونم چقدر دلت برام تنگ شده لازم نیست آنقدر دنبال نامه بگردی بچه 😏', number: 6 },
            { text: 'تو قلبم تورو دارممم اگه خونههه به دوشم من این عالم عشقوووو به عالم نفروشممم', number: 7 },
            { text: 'راستی دیگه وقتشه آدرس خونمون رو بهت بدم ، خونه من اونجاست که بوی تو باشه پنجره هاش هر بار ، رو به تو واشه', number: 8 },
            { text: 'الان دلم میخواد جلوی نور آفتاب روبروی پنکه بغلم میخوابیدی منم آنقدر بهت نگاه میکردم تا چشام خودش بسته میشد و بعدش با بوسای آروم تو از خواب بیدار میشدم.....', number: 9 },
            { text: 'چشات دنیامه تر صبح تو همه دنیامو بازش می‌کنی 🥺', number: 10 }
        ];

        // ============================================
        // متغیرها
        // ============================================
        
        let usedIndices = [];
        let currentIndex = -1;
        let isAnimating = false;

        // ============================================
        // تابع باز کردن نامه
        // ============================================
        
        function openLetter() {
            if (isAnimating) return;
            isAnimating = true;

            // پیدا کردن نامه‌ای که قبلاً نمایش داده نشده
            let availableIndices = [];
            for (let i = 0; i < letters.length; i++) {
                if (!usedIndices.includes(i)) {
                    availableIndices.push(i);
                }
            }

            // اگر همه نامه‌ها استفاده شده بودن، ریست کن
            if (availableIndices.length === 0) {
                usedIndices = [];
                availableIndices = letters.map((_, i) => i);
            }

            // انتخاب رندوم
            const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            usedIndices.push(randomIndex);
            currentIndex = randomIndex;

            const letter = letters[randomIndex];

            // انیمیشن جعبه
            const box = document.getElementById('box3d');
            box.style.animation = 'none';
            setTimeout(() => {
                box.style.animation = 'boxFloat 3s ease-in-out infinite';
            }, 50);

            // نمایش نامه با انیمیشن
            const container = document.getElementById('letterContainer');
            const text = document.getElementById('letterText');
            const number = document.getElementById('letterNumber');

            container.classList.remove('hidden-letter');
            container.style.transform = 'scale(0.8)';
            container.style.opacity = '0';
            
            setTimeout(() => {
                text.innerHTML = letter.text;
                number.textContent = `#${letter.number}`;
                container.style.transform = 'scale(1)';
                container.style.opacity = '1';
            }, 200);

            // ریزش قلب و گل
            createConfetti();

            isAnimating = false;
        }

        // ============================================
        // تابع ریزش قلب و گل
        // ============================================
        
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            const emojis = ['❤️', '💖', '💗', '💕', '💝', '🌸', '🌺', '🌷', '🌹', '💐', '✨', '🌟'];
            const count = 60;

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                piece.style.left = Math.random() * 100 + '%';
                piece.style.fontSize = (Math.random() * 20 + 16) + 'px';
                piece.style.animationDuration = (Math.random() * 3 + 2) + 's';
                piece.style.animationDelay = (Math.random() * 2) + 's';
                container.appendChild(piece);

                // حذف بعد از اتمام انیمیشن
                setTimeout(() => {
                    piece.remove();
                }, 5000);
            }
        }

        // ============================================
        // کلیک با Enter و Space
        // ============================================
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'E
